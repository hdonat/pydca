[project]
name = "pydca"
version = "0.1.0"
description = 'This package contains classes and functions for implementing direct cascaded machine learning models described by Littmann and Ritter.'
authors = [
    { name = "Heiko Donat", email = "info@hdonat.net" }
]
dependencies = [
    "numpy>=2.2.1",
    "scikit-learn>=1.6.0",
    "graphviz>=0.20.3",
    "scikit-optimize>=0.10.2",
    "qpsolvers[osqp]>=4.4.0",
]
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE"]
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "mkdocstrings-python>=2.0.9",
    "pytest>=8.3.4",
    "zensical>=0.0.65",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["pydca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
