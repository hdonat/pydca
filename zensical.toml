[project]
site_name = "pyDCA"
site_description = "Direct cascaded machine learning models described by Littmann and Ritter."
site_author = "Heiko Donat"
copyright = "Copyright &copy; 2019&ndash;2026 Heiko Donat. Licensed under the EUPL-1.2."
nav = [
  { "Home" = "index.md" },
  { "API reference" = [
    { "cascade" = "api/cascade.md" },
    { "learning_models" = "api/learning_models.md" },
  ] },
]

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
# The code uses Sphinx-style docstrings (:param x:, :type x:, :return:).
# Other values: "google", "numpy", "auto" (detect per docstring).
docstring_style = "sphinx"
show_submodules = true
show_source = true
merge_init_into_class = true
show_if_no_docstring = true
